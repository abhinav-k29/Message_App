<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>COMP6441 Chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <h1>COMP6441 Chat Demo</h1>

      <section>
        <h2>Connection</h2>

        <input
          id="username"
          placeholder="Username, e.g. Alice"
        >

        <input
          id="room"
          placeholder="Room, e.g. comp6441"
        >

        <button id="join">Join room</button>

        <p id="status">Not joined</p>
        <div>
          <input
            id="passphrase"
            type="password"
            placeholder="Shared room passphrase"
          >

          <button id="set-key">
            Create encryption key
          </button>

          <p id="key-status">
            Encryption key not created
          </p>

          <p>
            Fingerprint:
            <strong id="fingerprint">Not available</strong>
          </p>
        </div>
      </section>

      <section>
        <h2>Messages</h2>

        <ul id="messages"></ul>

        <input
          id="message"
          placeholder="Type a message"
        >

        <button id="send">Send</button>
      </section>
    </main>
    <!-- <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form> -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
